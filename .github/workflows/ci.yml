name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amigo_test
          POSTGRES_USER: amigo_test
          POSTGRES_PASSWORD: amigo_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amigo_test -d amigo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AMIGO_TEST_POSTGRES_URL: postgresql+psycopg://amigo_test:amigo_test_password@127.0.0.1:5432/amigo_test
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e './backend[test]'
      - run: pytest backend/tests
      - name: Verify the Alembic head and render offline SQL
        working-directory: backend
        run: |
          heads="$(alembic heads)"
          [[ "$(awk '/\(head\)$/ { count += 1 } END { print count + 0 }' <<<"${heads}")" -eq 1 ]]
          migration_sql="${RUNNER_TEMP}/amigo-migrations.sql"
          alembic upgrade head --sql >"${migration_sql}"
          test -s "${migration_sql}"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  frontend-e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --project=chromium --project=mobile

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
      - run: ./gradlew test lint --stacktrace

  release-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - name: Enforce trusted, commit-pinned Actions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          pattern = re.compile(r"^\s*(?:-\s*)?uses:\s+([^@\s]+)@([^\s#]+)")
          errors = []
          for workflow in Path(".github/workflows").glob("*.y*ml"):
              for line_number, line in enumerate(workflow.read_text(encoding="utf-8").splitlines(), 1):
                  match = pattern.match(line)
                  if match is None:
                      continue
                  action, revision = match.groups()
                  trusted = action.startswith("actions/") or action == "android-actions/setup-android"
                  if not trusted or re.fullmatch(r"[0-9a-f]{40}", revision) is None:
                      errors.append(f"{workflow}:{line_number}: untrusted or unpinned action: {action}@{revision}")
          if errors:
              raise SystemExit("\n".join(errors))
          PY
      - name: Check changed lines for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "${BASE_SHA}" =~ ^[0]+$ ]] || ! git cat-file -e "${BASE_SHA}^{commit}"; then
            BASE_SHA="$(git rev-list --max-parents=0 HEAD | tail -n 1)"
          fi
          git diff --check "${BASE_SHA}" "${GITHUB_SHA}"
      - name: Check deployment shell syntax
        run: |
          find deploy -type f -name '*.sh' -exec bash -n '{}' \;
          bash -n deploy/amigo-release
      - name: Run ShellCheck
        run: |
          find deploy -type f -name '*.sh' -exec shellcheck '{}' +
          shellcheck deploy/amigo-release
      - name: Validate least-privilege sudoers policy
        run: visudo -cf deploy/sudoers/amigo-release
      - name: Validate the production Compose model
        env:
          AMIGO_IMAGE_TAG: ${{ github.sha }}
        run: docker compose --env-file .env.example config --quiet
      - name: Build and inspect the production image
        run: |
          docker build \
            --build-arg "AMIGO_BUILD_SHA=${GITHUB_SHA}" \
            --tag "amigo:${GITHUB_SHA}" \
            .
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "amigo:${GITHUB_SHA}")" == "${GITHUB_SHA}" ]]

  publish-image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, frontend-e2e, android, release-gates]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Build the immutable production image
        run: |
          docker build \
            --build-arg "AMIGO_BUILD_SHA=${GITHUB_SHA}" \
            --tag "ghcr.io/tolstik/amigo:${GITHUB_SHA}" \
            .
          [[ "$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "ghcr.io/tolstik/amigo:${GITHUB_SHA}")" == "${GITHUB_SHA}" ]]
      - name: Publish the tested release image
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          docker push "ghcr.io/tolstik/amigo:${GITHUB_SHA}"
          docker logout ghcr.io
