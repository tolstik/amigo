name: amigo

x-application: &application
  image: amigo:${AMIGO_IMAGE_TAG:?AMIGO_IMAGE_TAG must be a Git SHA}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      AMIGO_BUILD_SHA: ${AMIGO_IMAGE_TAG:?AMIGO_IMAGE_TAG must be a Git SHA}
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=32m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  environment: &application-environment
    AMIGO_ENV: ${AMIGO_ENV:-production}
    AMIGO_PUBLIC_URL: ${AMIGO_PUBLIC_URL:-https://amigo.tolstik.ru/amigo/}
    AMIGO_TIMEZONE: ${AMIGO_TIMEZONE:-Europe/Moscow}
    AMIGO_USER_HEIGHT_CM: ${AMIGO_USER_HEIGHT_CM:-176}
    AMIGO_LOG_LEVEL: ${AMIGO_LOG_LEVEL:-INFO}
    AMIGO_STATIC_DIR: /app/static
    DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://amigo@db:5432/amigo}
    POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    AMIGO_SYNC_INTERVAL_SECONDS: ${AMIGO_SYNC_INTERVAL_SECONDS:-300}
    AMIGO_OUTBOX_POLL_SECONDS: ${AMIGO_OUTBOX_POLL_SECONDS:-60}
    AMIGO_NOTIFICATION_DEBOUNCE_SECONDS: ${AMIGO_NOTIFICATION_DEBOUNCE_SECONDS:-120}
    AMIGO_WEEKLY_DIGEST_DAY: ${AMIGO_WEEKLY_DIGEST_DAY:-mon}
    AMIGO_WEEKLY_DIGEST_TIME: ${AMIGO_WEEKLY_DIGEST_TIME:-09:00}
    AMIGO_DAILY_DIGEST_TIME: ${AMIGO_DAILY_DIGEST_TIME:-09:00}
    AMIGO_AI_ENABLED: ${AMIGO_AI_ENABLED:-true}
    AMIGO_AI_GATEWAY_URL: ${AMIGO_AI_GATEWAY_URL:-http://ai-gateway:8090}
    AMIGO_AI_GATEWAY_TIMEOUT_SECONDS: ${AMIGO_AI_GATEWAY_TIMEOUT_SECONDS:-90}
    AMIGO_AI_POLL_SECONDS: ${AMIGO_AI_POLL_SECONDS:-60}
    AMIGO_AI_DEBOUNCE_SECONDS: ${AMIGO_AI_DEBOUNCE_SECONDS:-300}
    AMIGO_AI_ACTIVITY_MIN_INTERVAL_SECONDS: ${AMIGO_AI_ACTIVITY_MIN_INTERVAL_SECONDS:-3600}
    AMIGO_AI_STALE_SECONDS: ${AMIGO_AI_STALE_SECONDS:-86400}
    AMIGO_LAB_STORAGE_DIR: /lab-files
    AMIGO_LAB_PARSER_URL: http://lab-parser:8085
    AMIGO_LAB_PARSER_TIMEOUT_SECONDS: ${AMIGO_LAB_PARSER_TIMEOUT_SECONDS:-180}
    AMIGO_ANDROID_APK_PATH: /android/amigo-sync.apk
    AMIGO_ANDROID_APK_VERSION_CODE: ${AMIGO_ANDROID_APK_VERSION_CODE:-5}
    AMIGO_ANDROID_APK_VERSION_NAME: ${AMIGO_ANDROID_APK_VERSION_NAME:-1.2.0}
  secrets:
    - postgres_password
  volumes:
    - type: bind
      source: /srv/amigo/data/import
      target: /imports
      read_only: true
  networks:
    - backend
  depends_on:
    db:
      condition: service_healthy
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

x-integration-environment: &integration-environment
  <<: *application-environment
  AMIGO_ENCRYPTION_KEY_FILE: /run/secrets/app_encryption_key
  WITHINGS_CLIENT_ID_FILE: /run/secrets/withings_client_id
  WITHINGS_CLIENT_SECRET_FILE: /run/secrets/withings_client_secret
  WITHINGS_ACCESS_TOKEN_FILE: /run/secrets/withings_access_token
  WITHINGS_REFRESH_TOKEN_FILE: /run/secrets/withings_refresh_token
  TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
  TELEGRAM_CHAT_ID_FILE: /run/secrets/telegram_chat_id

x-integration-secrets: &integration-secrets
  - postgres_password
  - app_encryption_key
  - withings_client_id
  - withings_client_secret
  - withings_access_token
  - withings_refresh_token
  - telegram_bot_token
  - telegram_chat_id

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amigo}
      POSTGRES_USER: ${POSTGRES_USER:-amigo}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      TZ: ${AMIGO_TIMEZONE:-Europe/Moscow}
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 20s
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  web:
    <<: *application
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - ${AMIGO_WEB_BIND:-127.0.0.1}:${AMIGO_WEB_PORT:-18181}:8000
    volumes:
      - type: bind
        source: /srv/amigo/data/import
        target: /imports
        read_only: true
      - type: bind
        source: /srv/amigo/data/lab-files
        target: /lab-files
      - type: bind
        source: /srv/amigo/data/android
        target: /android
        read_only: true
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  worker:
    <<: *application
    environment: *integration-environment
    secrets: *integration-secrets
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/cmdline"]
      interval: 120s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  ingest:
    <<: *application
    command:
      - python
      - -m
      - uvicorn
      - app.ingest_main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --forwarded-allow-ips=*
    ports:
      - ${AMIGO_INGEST_BIND:-127.0.0.1}:${AMIGO_INGEST_PORT:-18182}:8000
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/healthz"]
      interval: 60s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  ai-worker:
    <<: *application
    command: ["python", "-m", "app.ai_worker"]
    networks:
      - backend
      - ai_private
      - lab_private
    volumes:
      - type: bind
        source: /srv/amigo/data/import
        target: /imports
        read_only: true
      - type: bind
        source: /srv/amigo/data/lab-files
        target: /lab-files
        read_only: true
    depends_on:
      db:
        condition: service_healthy
      ai-gateway:
        condition: service_healthy
      lab-parser:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -r /proc/1/cmdline"]
      interval: 120s
      timeout: 3s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s

  ai-gateway:
    image: amigo:${AMIGO_IMAGE_TAG:?AMIGO_IMAGE_TAG must be a Git SHA}
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      HOME: /tmp/amigo-ai-home
      CODEX_HOME: /run/amigo-ai-codex
      AMIGO_AI_GATEWAY_HOST: 0.0.0.0
      AMIGO_AI_GATEWAY_PORT: 8090
      AMIGO_AI_CODEX_BINARY: /opt/amigo/codex
      AMIGO_AI_CODEX_HOME: /run/amigo-ai-codex
      AMIGO_AI_CODEX_WORK_DIR: /tmp/amigo-ai-work
      AMIGO_AI_CODEX_TIMEOUT_SECONDS: ${AMIGO_AI_CODEX_TIMEOUT_SECONDS:-75}
      AMIGO_AI_CODEX_CONCURRENCY: 1
      AMIGO_LOG_LEVEL: ${AMIGO_LOG_LEVEL:-INFO}
    volumes:
      - type: bind
        source: /srv/amigo/data/codex-bin/codex
        target: /opt/amigo/codex
        read_only: true
      - type: bind
        source: /srv/amigo/data/codex-state
        target: /run/amigo-ai-codex
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks:
      - ai_private
    command: ["python", "-m", "app.ai_gateway"]
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/healthz"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 100s

  lab-parser:
    image: amigo:${AMIGO_IMAGE_TAG:?AMIGO_IMAGE_TAG must be a Git SHA}
    restart: unless-stopped
    init: true
    read_only: true
    user: "65532:65532"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      AMIGO_LOG_LEVEL: ${AMIGO_LOG_LEVEL:-INFO}
    tmpfs:
      - /tmp:size=256m,mode=1777
    networks:
      - lab_private
    command: ["python", "-m", "app.lab_parser"]
    healthcheck:
      test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8085/healthz"]
      interval: 60s
      timeout: 5s
      retries: 5
      start_period: 20s
    mem_limit: 768m
    cpus: 1.5
    pids_limit: 128
    stop_grace_period: 30s

volumes:
  postgres_data:

networks:
  backend:
    internal: false
  ai_private:
    internal: false
  lab_private:
    internal: true

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_encryption_key:
    file: ./secrets/app_encryption_key
  withings_client_id:
    file: ./secrets/withings_client_id
  withings_client_secret:
    file: ./secrets/withings_client_secret
  withings_access_token:
    file: ./secrets/withings_access_token
  withings_refresh_token:
    file: ./secrets/withings_refresh_token
  telegram_bot_token:
    file: ./secrets/telegram_bot_token
  telegram_chat_id:
    file: ./secrets/telegram_chat_id
