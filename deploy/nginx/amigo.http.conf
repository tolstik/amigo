# Loaded in nginx's http context through /etc/nginx/conf.d/*.conf.
# The public edge may aggregate clients at the origin, so the rate is generous
# enough for dashboard fan-out while still bounding abusive anonymous traffic.
limit_req_zone $binary_remote_addr zone=amigo_read:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=amigo_ingest:10m rate=60r/m;

map $uri $amigo_cache_control {
    ~^/amigo/assets/ "public, max-age=31536000, immutable";
    default "no-store";
}
