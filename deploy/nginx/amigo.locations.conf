location /amigo/ {
    limit_req zone=amigo_read burst=60 nodelay;
    limit_req_status 429;

    limit_except GET HEAD OPTIONS {
        deny all;
    }

    # The application serves /api and /assets at its root; nginx removes the
    # public /amigo/ prefix and conveys it separately below.
    proxy_pass http://127.0.0.1:18181/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /amigo;
    proxy_redirect off;
    proxy_hide_header Cache-Control;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 1m;

    add_header Cache-Control $amigo_cache_control always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
}
