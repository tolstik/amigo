# Managed by /srv/amigo/deploy/nginx-control.sh.
# Include only inside the established origin server blocks.

location = /.well-known/assetlinks.json {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    default_type application/json;
    add_header Cache-Control "public, max-age=3600" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    return 200 '[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"android_app","package_name":"ru.tolstik.amigo.sync","sha256_cert_fingerprints":["25:CC:38:EC:B3:10:81:F6:82:6F:F0:49:B8:07:33:5A:05:E8:6E:E9:89:54:70:97:5E:85:21:AF:95:19:1C:02"]}}]';
}

location = /amigo {
    # The public TLS edge talks to this origin over HTTP. Keep Location
    # relative so nginx does not turn it into an insecure absolute URL.
    absolute_redirect off;
    return 308 /amigo/;
}

# These routes exist on the loopback application only. Exact matches take
# precedence over the public prefix proxy below.
location = /amigo/healthz {
    return 404;
}

location = /amigo/internal/health {
    return 404;
}

location = /amigo-ingest/v1/devices/register {
    limit_req zone=amigo_ingest burst=20 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18182;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
}

