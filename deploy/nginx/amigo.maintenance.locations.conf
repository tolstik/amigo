# Auth-floor maintenance route. It intentionally keeps signed Android ingest
# available while an authentication-capable dashboard release is unavailable.
location = /amigo {
    absolute_redirect off;
    return 308 /amigo/;
}

location ^~ /amigo/ {
    error_page 503 =503 @amigo_auth_floor_503;
    return 503;
}

# The shared origin server defines an inherited 503 error page whose static
# file is not guaranteed to exist. A named handler keeps the auth floor at the
# required status without depending on that unrelated server-level asset.
location @amigo_auth_floor_503 {
    # Defining any location-level error_page prevents nginx from inheriting the
    # shared server-level 503 handler here. Status 418 is never emitted.
    error_page 418 =418 /amigo/;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "300" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    default_type text/plain;
    return 503 "Service temporarily unavailable\n";
}

location = /amigo-ingest/v1/devices/register {
    limit_req zone=amigo_ingest burst=20 nodelay;
    limit_req_status 429;
    limit_except POST { deny all; }
    proxy_pass http://127.0.0.1:18182;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 1m;
    add_header Cache-Control "no-store" always;
}

location ~ "^/amigo-ingest/v1/devices/[A-Za-z0-9_-]{16,128}/status$" {
    limit_req zone=amigo_ingest burst=20 nodelay;
    limit_req_status 429;
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18182;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
    add_header Cache-Control "no-store" always;
}

